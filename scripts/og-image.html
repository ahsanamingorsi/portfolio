<!doctype html><html><head><meta charset="utf-8"><style>
/* Template for public/og-image.png (1200x630). Open through a local server at the site root and screenshot at 1200x630. */
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#080D18;color:#F8FAFC;font-family:'Inter Display','Inter',sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(38,54,80,.6) 1px,transparent 1px) 0 0/60px 60px,linear-gradient(90deg,rgba(38,54,80,.6) 1px,transparent 1px) 0 0/60px 60px;-webkit-mask-image:radial-gradient(ellipse 80% 90% at 75% 40%,#000 15%,transparent 75%)}
.glow{position:absolute;width:820px;height:820px;right:-180px;top:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(37,99,235,.42),transparent)}
.glow2{position:absolute;width:480px;height:480px;left:300px;bottom:-300px;border-radius:50%;background:radial-gradient(closest-side,rgba(6,182,212,.2),transparent)}
.c{position:absolute;left:72px;top:64px;bottom:64px;width:660px;display:flex;flex-direction:column}
.c img{height:64px;width:auto;align-self:flex-start}
h1{font-size:104px;line-height:.92;letter-spacing:-.045em;font-weight:700;margin-top:auto}
.ids{font-size:34px;font-weight:500;margin-top:28px;letter-spacing:-.01em}
.ids span{color:#94A3B8}
.tag{font:500 20px 'DejaVu Sans Mono',monospace;color:#06B6D4;margin-top:22px}
.f{position:absolute;right:84px;top:76px;width:382px;height:478px;border-radius:22px;border:1px solid #263650;overflow:visible}
.f img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:22px}
.t{position:absolute;width:30px;height:30px;border:3px solid #06B6D4}
.tl{top:-12px;left:-12px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.br{bottom:-12px;right:-12px;border-left:0;border-top:0;border-bottom-right-radius:10px}
</style></head><body><div class="grid"></div><div class="glow"></div><div class="glow2"></div>
<div class="c"><img src="/images/optimized/aag-logo-600.webp"><h1>Ahsan Amin<br>Gorsi</h1>
<p class="ids">Developer. <span>Creator. Entrepreneur.</span></p><p class="tag">Ideas into technology.</p></div>
<div class="f"><img src="/images/optimized/profile-960.webp"><span class="t tl"></span><span class="t br"></span></div>
</body></html>
